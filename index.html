<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./src/css/style.css" />
  <!-- SEO -->
  <meta name="title" content="Task Organizer - Plan and Manage Your Tasks" />
  <meta name="description" content="Organize your tasks easily with this simple and modern task manager." />
  <meta name="keywords" content="task manager, todo app, productivity, organizer, task list" />
  <meta name="author" content="Isaac David Quintero Lobo" />

  <title>Task Organizer</title>
</head>

<body>
  <header>
    <h3>👋 Hi!</h3>
    <h1>Welcome to your Task Organizer</h1>
  </header>

  <main>
    <h2>Task area:</h2>

    <section class="container_main">
      <article class="staged" id="staged_pending">
        <div class="header__staged">
          <p>PENDING:</p>
          <img src="./public/img/plus-svgrepo-com.svg" width="20" class="openModalButton" data-status="pending"
            style="cursor:pointer" />
        </div>
        <div id="container_task_pending" class="container__class"></div>
      </article>

      <article class="staged" id="staged_hold">
        <div class="header__staged">
          <p>ON-HOLD:</p>
          <img src="./public/img/plus-svgrepo-com.svg" width="20" class="openModalButton" data-status="on-hold"
            style="cursor:pointer" />
        </div>
        <div id="container_task_hold" class="container__class"></div>
      </article>

      <article class="staged" id="staged_progress">
        <div class="header__staged">
          <p>IN-PROGRESS:</p>
          <img src="./public/img/plus-svgrepo-com.svg" width="20" class="openModalButton" data-status="in-progress"
            style="cursor:pointer" />
        </div>
        <div id="container_task_progress" class="container__class"></div>
      </article>

      <article class="staged" id="staged_completed">
        <div class="header__staged">
          <p>COMPLETED:</p>
          <img src="./public/img/plus-svgrepo-com.svg" width="20" class="openModalButton" data-status="completed"
            style="cursor:pointer" />
        </div>
        <div id="container_task_completed" class="container__class"></div>
      </article>
    </section>

    <!-- ✅ Modal Overlay -->
    <div class="overlay" id="overlay" style="display: none;">
      <div class="modal">
        <!-- ❌ Close Button -->
        <button type="button" id="closeButton">✖</button>

        <!-- 📝 Dynamic Title -->
        <h2 id="tituloModal">📝 Add a New Task</h2>

        <!-- 🧾 Form -->
        <form id="taskForm">
          <label for="title">Title:</label><br />
          <input type="text" id="title" name="title" required /><br /><br />

          <label for="description">Description:</label><br />
          <textarea id="description" name="description" rows="3" required></textarea><br /><br />

          <label for="status">Status:</label><br />
          <select id="status" name="status" required>
            <option value="pending">⏳ Pending</option>
            <option value="on-hold">🕒 On Hold</option>
            <option value="in-progress">🚧 In Progress</option>
            <option value="completed">✅ Completed</option>
          </select><br /><br />

          <label for="dueDate">Due date:</label><br />
          <input type="date" id="dueDate" name="dueDate" required /><br /><br />

          <div class="section__button">
            <button type="submit">💾 Save</button>
            <button type="button" id="deleteButton" class="hidden">🗑️ Delete</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>📌 Task Organizer Project - Created by <strong>Isaac Q.</strong></p>
    <p>🔗 <a href="https://github.com/iquintero24" target="_blank">GitHub</a> | 📧 <a
        href="isaacquintero4k@gmail.com">Contact</a></p>
    <p>🕒 &copy; 2025 | Boost your productivity, one task at a time!</p>
  </footer>

  <!-- 📦 Script -->
  <script type="module" src="./src/js/app.js"></script>
</body>

</html>
